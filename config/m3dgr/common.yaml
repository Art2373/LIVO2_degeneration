# MID360/D435i processing profile, using a separate given fusion model.
# Intrinsics and camera installation transform are supplied by the model provider.
common:
  lid_topic: /livox/mid360/lidar
  imu_topic: /livox/mid360/imu
  img_topic: /camera/color/image_raw
  lidar_en: 1
  img_en: 1
  ros_driver_bug_fix: false
extrin_calib:
  extrinsic_T:
  - -0.011
  - -0.02329
  - 0.04412
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
fusion_model:
  enabled: true
  image_scale: 0.5
  heartbeat_timeout: 3.0
  max_baseline: 1.0
  processing_delay: 0.2
  max_visual_angular_speed: 0.8
time_offset:
  imu_time_offset: 0.0
  lidar_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0
preprocess:
  hilti_en: false
  lidar_type: 1
  scan_line: 4
  blind: 0.5
  point_filter_num: 1
  filter_size_surf: 0.1
  feature_extract_enabled: false
imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.1
  gyr_cov: 0.1
  gravity_est_en: true
  ba_bg_est_en: true
lio:
  sigma_num: 3.0
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num:
  - 5
  - 5
  - 5
  - 5
  - 5
vio:
  max_iterations: 5
  img_point_cov: 300
  outlier_threshold: 1000
  grid_size: 20
  grid_n_height: 12
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1
local_map:
  map_sliding_en: true
  half_map_size: 60
  sliding_thresh: 8
uav:
  imu_rate_odom: false
  gravity_align_en: false
publish:
  dense_map_en: false
  pub_scan_num: 1
  pub_effect_point_en: false
  pub_plane_en: false
  blind_rgb_points: 0.5
evo:
  seq_name: m3dgr_unassigned
  pose_output_en: true
pcd_save:
  pcd_save_en: false
  colmap_output_en: false
  interval: -1
  type: 0
  filter_size_pcd: 0.1
image_save:
  img_save_en: false
  interval: 1
debug:
  plot_time: -10.0
  frame_cnt: 6
